<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 104" role="img" aria-label="G-Therm Haustechnik">
  <!-- Flammen-/G-Marke (leicht kursiv, mit trailenden Flammenstrichen) -->
  <g fill="#0b2f5e" transform="skewX(-9)">
    <!-- Flammen-Trails links, tapernd -->
    <path d="M18 26 h40 l-10 9 H24 z"/>
    <path d="M8 41 h52 l-10 9 H14 z"/>
    <path d="M22 56 h34 l-10 9 H28 z"/>
    <!-- G-Körper (fette Flamme mit Öffnung rechts + Querbalken) -->
    <path d="M92 12
             c-23 0 -39 16 -39 40
             c0 24 16 40 39 40
             c13 0 24 -5 31 -15
             l-16 -11
             c-3 5 -8 8 -15 8
             c-12 0 -20 -9 -20 -22
             c0 -13 8 -22 20 -22
             c7 0 13 3 16 8
             l16 -10
             c-6 -9 -17 -14 -32 -14 z"/>
    <path d="M86 44 h37 v17 h-17 v-7 h-20 z"/>
  </g>
  <!-- Wortmarke: THERM (schwer, eng) mit Über-/Unterlinie -->
  <g fill="#0b2f5e">
    <rect x="150" y="20" width="230" height="4"/>
    <text x="150" y="64" font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900" font-size="48" letter-spacing="2">THERM</text>
    <rect x="150" y="72" width="230" height="4"/>
    <text x="152" y="96" font-family="'Segoe UI','Arial',sans-serif" font-weight="800" font-size="18.5" letter-spacing="9.5">HAUSTECHNIK</text>
  </g>
</svg>
